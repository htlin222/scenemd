name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run typecheck
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # ~190MB Chromium download; the suite itself runs in about 11s. Cached
      # across runs by the key below, so only a Playwright bump pays full price.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      # Rendered geometry — column layout, frame heights, caption widths — is
      # invisible to the node-environment vitest suite, so nothing else in CI
      # can catch a figure-layout regression.
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # Self-contained: launches wrangler pages dev (local D1/R2/DO, AI
      # stripped — no Cloudflare credentials in CI) plus headless Chrome.
      - run: node tools/browser-check.mjs
        env:
          SCENEMD_NO_AI: "1"
          CHROME_PATH: /usr/bin/google-chrome
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: smoke-screenshots
          path: artifacts/*.png
          if-no-files-found: ignore
