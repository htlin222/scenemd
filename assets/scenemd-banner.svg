    <path d="M400 24h42" stroke="#9ca39d" stroke-width="2"/>
    <path d="m436 18 8 6-8 6" fill="none" stroke="#9ca39d" stroke-width="2"/>
    <rect x="466" width="112" height="48" rx="7" fill="#18a66b"/>
    <text x="490" y="31" fill="#fff">SCENE</text>
  </g>
  <g transform="translate(990 102)" filter="url(#shadow)">
    <rect width="500" height="390" rx="10" fill="#fff" stroke="#d9d8d2"/>
    <rect width="14" height="390" rx="10 0 0 10" fill="#18a66b"/>
    <rect x="58" y="42" width="114" height="24" rx="3" fill="#18a66b"/>
    <rect x="374" y="48" width="68" height="9" rx="4" fill="#c7cbc7"/>
    <text x="58" y="134" fill="#0b6e48" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="43" font-weight="800" letter-spacing="-2">Meaning, composed.</text>
    <rect x="58" y="168" width="326" height="12" rx="6" fill="#404641" opacity=".82"/>
    <rect x="58" y="194" width="282" height="12" rx="6" fill="#70756f" opacity=".56"/>
    <rect x="58" y="220" width="306" height="12" rx="6" fill="#70756f" opacity=".56"/>
    <path d="M58 270h316" stroke="#d9d8d2" stroke-width="2" stroke-dasharray="3 7"/>
    <circle cx="67" cy="309" r="5" fill="#18a66b"/>
    <rect x="84" y="303" width="242" height="11" rx="5" fill="#404641" opacity=".72"/>
    <circle cx="67" cy="341" r="5" fill="#18a66b"/>
    <rect x="84" y="335" width="204" height="11" rx="5" fill="#404641" opacity=".72"/>
    <rect x="58" y="380" width="218" height="3" fill="#18a66b"/>
    <text x="430" y="365" fill="#70756f" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">3 / 12</text>
  </g>
  <g transform="translate(1130 520)" fill="#626a63" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">
