<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="640" viewBox="0 0 1600 640" role="img" aria-labelledby="title description">
  <title id="title">SceneMD — Present documents, not slides</title>
  <desc id="description">A Markdown document flows through meaning into a responsive presentation scene.</desc>
  <defs>
    <linearGradient id="wash" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#fbfaf7"/>
      <stop offset="1" stop-color="#edf8f2"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#153c2c" flood-opacity=".12"/>
    </filter>
  </defs>
  <rect width="1600" height="640" rx="36" fill="url(#wash)"/>
  <path d="M0 0h30v640H0z" fill="#18a66b"/>
  <g transform="translate(110 88)">
    <g aria-hidden="true">
      <rect width="42" height="42" rx="10" fill="none" stroke="#191b19" stroke-width="2"/>
      <path d="M10 12h15M10 20h23M10 28h18" stroke="#191b19" stroke-width="4" stroke-linecap="round"/>
      <path d="M26 28h7" stroke="#18a66b" stroke-width="4" stroke-linecap="round"/>
    </g>
    <text x="58" y="32" fill="#191b19" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="34" font-weight="800" letter-spacing="-1.5">Scene<tspan fill="#18a66b">MD</tspan></text>
  </g>
  <g transform="translate(110 200)">
    <text fill="#191b19" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="76" font-weight="780" letter-spacing="-4">
      <tspan x="0" y="0">Present documents,</tspan>
      <tspan x="0" y="84">not slides.</tspan>
    </text>
    <text x="3" y="142" fill="#626a63" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="25">A semantic, responsive presentation engine for ordinary Markdown.</text>
  </g>
  <g transform="translate(110 506)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="600">
    <rect width="156" height="48" rx="7" fill="#ffffff" stroke="#d9d8d2"/>
    <text x="24" y="31" fill="#191b19">DOCUMENT</text>
    <path d="M178 24h42" stroke="#9ca39d" stroke-width="2"/>
    <path d="m214 18 8 6-8 6" fill="none" stroke="#9ca39d" stroke-width="2"/>
    <rect x="244" width="134" height="48" rx="7" fill="#d9f2e5"/>
